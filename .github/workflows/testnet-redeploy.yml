name: TestNet redeploy

# Keyed job. Not a merge gate. Creates a NEW TestNet application from the
# committed TEAL. App 763809096 cannot be patched — on_update / on_delete
# reject every UpdateApplication / DeleteApplication (I1/I5).
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   DEPLOYER_MNEMONIC   25-word funded TestNet account
# Not required:
#   ALGOD_URL, ALGOD_TOKEN, ALGOD_SERVER, ALGOD_PORT, ALGOD_*
#   (deploy_testnet.py uses AlgorandClient.testnet() → public TestNet algod)
# Never set:
#   any MainNet mnemonic or token
#
# Dispatch: Actions → TestNet redeploy → Run workflow → type TESTNET.
# Success is verify_deployment.py MATCH at 709 B (or whatever the committed
# TEAL assembles to that day) on the NEW app id printed in the log.
# Then retarget APP_ID / PINNED_ON_CHAIN_SHA512_256 (BLOCKERS.md).
# Live follow-up jobs stay red until that retarget lands.

on:
  workflow_dispatch:
    inputs:
      confirm_testnet_only:
        description: "Type TESTNET to create a new TestNet app from committed TEAL (763809096 cannot be patched in place)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testnet-redeploy
  cancel-in-progress: false

jobs:
  redeploy:
    name: Create new TestNet app from committed TEAL
    runs-on: ubuntu-latest
    steps:
      - name: Confirm TestNet-only
        env:
          CONFIRM: ${{ github.event.inputs.confirm_testnet_only }}
        run: |
          if [ "$CONFIRM" != "TESTNET" ]; then
            echo "::error::Refusing to run. Type TESTNET to confirm. MainNet is forbidden."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Fail closed if DEPLOYER_MNEMONIC is unset
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
        run: python contracts/require_testnet_deploy_secret.py

      # Same pinned signer as testnet-e2e / signature-kat. A silent sampler
      # change on a deterministic signer must never go unnoticed.
      - name: Stage the vendored pinned Falcon tree (commit ce15e75, no network)
        run: cp -r third_party/falcon-det1024/src falcon-src

      - name: Assert pinned-build digest + emulated FP backend
        run: python sdk/ci/verify_pinned_digest.py falcon-src

      - name: Build the deterministic Falcon-1024 shared library
        run: |
          cd falcon-src
          cc -O3 -fPIC -DFALCON_UNALIGNED=0 -fno-strict-aliasing -shared -o libfalcondet1024.so \
            codec.c common.c falcon.c fft.c fpr.c keygen.c rng.c shake.c sign.c vrfy.c deterministic.c
          echo "FALCON_DET1024_LIB=$PWD/libfalcondet1024.so" >> "$GITHUB_ENV"

      - name: Install the contract deploy dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r contracts/requirements.txt

      # Presence-only ran before pip. algosdk is available now: reject a
      # non-mnemonic secret WITHOUT printing it (algosdk ValueError includes
      # the word list — that must never reach the log).
      - name: Fail closed if DEPLOYER_MNEMONIC is not a valid Algorand mnemonic
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
        run: python contracts/require_testnet_deploy_secret.py --parse

      - name: Deploy a new TestNet app from the committed client
        id: deploy
        continue-on-error: true
        working-directory: contracts
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
        run: |
          # Sanctioned path from BLOCKERS.md. Creates a NEW app id.
          # Never enable shell trace: it would dump the environment.
          set +x
          python deploy_testnet.py

      # create() writes app_id before mint/register/inscribe. If a later step
      # fails, the new app still exists and bytecode match is still the goal.
      - name: Require a numeric app id from the deploy step
        if: always() && !cancelled() && steps.deploy.conclusion != 'skipped'
        run: |
          app_id="${{ steps.deploy.outputs.app_id }}"
          if ! [[ "$app_id" =~ ^[0-9]+$ ]]; then
            echo "::error::deploy_testnet.py did not write a numeric app_id to GITHUB_OUTPUT"
            exit 1
          fi
          echo "new TestNet app id: $app_id"

      - name: Assembled committed TEAL must MATCH the new app
        if: always() && !cancelled() && steps.deploy.conclusion != 'skipped' && steps.deploy.outputs.app_id != ''
        run: |
          app_id="${{ steps.deploy.outputs.app_id }}"
          set +e
          python contracts/verify_deployment.py --app-id "$app_id"
          rc=$?
          set -e
          if [ "$rc" != "0" ]; then
            echo "::error::new app $app_id does not match the committed TEAL (exit $rc). See BLOCKERS.md."
            exit "$rc"
          fi

      - name: Print retarget checklist (no secrets)
        if: always() && !cancelled() && steps.deploy.conclusion != 'skipped' && steps.deploy.outputs.app_id != ''
        run: |
          app_id="${{ steps.deploy.outputs.app_id }}"
          echo "MATCH on new TestNet app $app_id is the redeploy success criterion."
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "::warning::deploy_testnet.py did not finish (register/inscribe may have failed). Bytecode match is still what closes the drift."
          fi
          echo "App 763809096 is unchanged (I1/I5). Retarget:"
          echo "  contracts/verify_deployment.py  DEFAULT_APP_ID"
          echo "  sdk/examples/verify_trelyan.py  APP_ID + PINNED_ON_CHAIN_SHA512_256"
          echo "  README.md, REVIEWER.md, sdk/docs/DEMO.md, ROADMAP.md, AUDIT_READINESS.md"
          echo "  BLOCKERS.md — close the OPEN section once TestNet follow-up is green"
          echo "Explorer: https://lora.algokit.io/testnet/application/${app_id}"
