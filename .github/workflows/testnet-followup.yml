name: TestNet follow-up

# Not a merge gate. Local KAT / TEAL-recompile / gitleaks live in ci.yml
# ("Required merge gates (local)") and rust-ci.yml ("Required merge gates (rust)").
#
# These jobs still RUN and still FAIL on bytecode drift. They were red for three
# months because TestNet app 763809096 predated the committed contract; app
# 770964251 was deployed from that artifact on 2026-09-03 and they now pass. Do
# not add continue-on-error, do not skip on mismatch, and do not copy a hash from
# the chain and call it agreement. After any future keyed redeploy (BLOCKERS.md), this
# workflow is what goes green — then it can be added as a required check.

on:
  push:
    paths:
      - "sdk/**"
      - "contracts/**"
      - "third_party/**"
      - ".github/workflows/testnet-followup.yml"
      - "rust/crates/teal-deploy-verify/**"
      - "BLOCKERS.md"
  pull_request:
    paths:
      - "sdk/**"
      - "contracts/**"
      - "third_party/**"
      - ".github/workflows/testnet-followup.yml"
      - "rust/crates/teal-deploy-verify/**"
      - "BLOCKERS.md"
  schedule:
    - cron: "23 6 * * 1"   # same Monday slot as trelyan-pq CI
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-live:
    name: Live TestNet verification (follow-up; not a merge gate)
    runs-on: ubuntu-latest
    # Same scope as before the split: push / schedule / dispatch, not every PR.
    # The PR-visible half of this follow-up is contract-drift below.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the published package from PyPI and verify the deployed approval program + boxes (clear-state not compared)
        run: |
          python -m pip install --upgrade pip
          pip install trelyan-pq
          set +e
          python sdk/examples/verify_trelyan.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "::error::AWAITING TESTNET REDEPLOY of app 770964251. Committed approval TEAL assembles to a different program than the live approval program. See BLOCKERS.md."
          fi
          exit "$rc"
        # Read-only. No account, no mnemonic, no secrets.
        # Exit 1 = a check failed (e.g. the deployed approval program is not what the committed approval TEAL assembles to).
        # Exit 2 = a check did not run. Never treated as agreement.

  contract-drift:
    name: Committed approval TEAL vs deployed approval program (follow-up; not a merge gate)
    # Derives expected bytecode from the committed artifact, so it CAN fail.
    # The drift it exposed had already run 58 days undetected, because the previous
    # verifier compared the chain to itself. This job ran red from 2026-08-30 until a
    # new app was created from the committed artifact (app 763809096 could not be
    # updated — I1/I5). Green since 2026-09-03 on app 770964251. If it ever goes red
    # again, that red is the finding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Assemble the committed approval TEAL and compare it to the deployed approval program (clear-state not compared)
        run: |
          set +e
          python contracts/verify_deployment.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "::error::AWAITING TESTNET REDEPLOY of app 770964251. Committed approval TEAL assembles to a different program than the live approval program. See BLOCKERS.md."
          fi
          exit "$rc"
        # Exit 1 = drift: the deployed approval program is not what the committed approval TEAL assembles to.
        # Exit 2 = could not check (network, missing artifact). Distinct on purpose:
        # an unreachable node must never be reported as agreement, nor as drift.

  contract-drift-rust:
    name: Committed approval + clear-state TEAL vs deployed programs, Rust port (follow-up; not a merge gate)
    # rust/crates/teal-deploy-verify is the Rust port of contracts/verify_deployment.py. It runs
    # BESIDE the Python job above, not instead of it: same default target (TestNet app 770964251),
    # same exit codes, but it ALSO compares the clear-state program, which the Python job does not.
    # A separate job on purpose, so a failure in either can never hide the other's result.
    # Read-only: two TEAL compiles and two GETs through the runner's own curl. No secrets.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo --version && curl --version | head -n 1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: rust
      # Its own step, so a build failure (cargo exits 101) can never be read as one of the
      # verifier's exit codes.
      - name: Build the verifier
        run: cargo build --locked -p teal-deploy-verify
      - name: Assemble both committed TEAL programs and compare them to the deployed programs
        run: |
          set +e
          ./target/debug/verify-deployment
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "::error::DRIFT on TestNet app 770964251 (approval and/or clear-state program): the deployed bytecode is not what the committed TEAL assembles to. See BLOCKERS.md."
          fi
          exit "$rc"
        # Exit 1 = drift in the approval OR the clear-state program.
        # Exit 2 = could not check (network, missing artifact, bad response, usage error).
        # Distinct on purpose: never reported as agreement, nor as drift.
