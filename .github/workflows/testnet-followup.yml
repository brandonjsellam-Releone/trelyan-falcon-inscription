name: TestNet follow-up

# Not a merge gate. Local KAT / TEAL-recompile / gitleaks live in ci.yml
# ("Required merge gates (local)") and rust-ci.yml ("Required merge gates (rust)").
#
# These jobs still RUN and still FAIL on drift between the deployed app and the
# committed artifacts. They were red for three
# months because TestNet app 763809096 predated the committed contract; app
# 770964251 was deployed from that artifact on 2026-09-03 and they now pass. Do
# not add continue-on-error, do not skip on mismatch, and do not copy a hash from
# the chain and call it agreement. After any future keyed redeploy (BLOCKERS.md), this
# workflow is what goes green — then it can be added as a required check.

on:
  push:
    paths:
      - "sdk/**"
      - "contracts/**"
      - "third_party/**"
      - ".github/workflows/testnet-followup.yml"
      - "BLOCKERS.md"
  pull_request:
    paths:
      - "sdk/**"
      - "contracts/**"
      - "third_party/**"
      - ".github/workflows/testnet-followup.yml"
      - "BLOCKERS.md"
  schedule:
    - cron: "23 6 * * 1"   # same Monday slot as trelyan-pq CI
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-live:
    name: Live TestNet verification (follow-up; not a merge gate)
    runs-on: ubuntu-latest
    # Same scope as before the split: push / schedule / dispatch, not every PR.
    # The PR-visible half of this follow-up is contract-drift below.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install the published package from PyPI and verify the deployed approval and clear-state programs + boxes
        run: |
          python -m pip install --upgrade pip
          pip install trelyan-pq
          set +e
          python sdk/examples/verify_trelyan.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "::error::verify_trelyan.py reported a FAILED check against app 770964251 (see the FAIL lines). If a FAIL line is one of the two 'deployed ... program is what the committed ... TEAL assembles to' checks, the live app differs from the committed TEAL: AWAITING TESTNET REDEPLOY, see BLOCKERS.md. A pin FAIL alone means the app or the pin constant changed."
          fi
          exit "$rc"
        # Read-only. No account, no mnemonic, no secrets.
        # Exit 1 = a check failed (e.g. the deployed approval or clear-state program is not what the committed TEAL assembles to).
        # Exit 2 = a check did not run. Never treated as agreement.

  contract-drift:
    name: Committed artifacts vs deployed app - programs, state schemas, extra pages (follow-up; not a merge gate)
    # Derives every expected value from the committed artifacts, so it CAN fail.
    # The drift it exposed had already run 58 days undetected, because the previous
    # verifier compared the chain to itself. This job ran red from 2026-08-30 until a
    # new app was created from the committed artifact (app 763809096 could not be
    # updated — I1/I5). Green since 2026-09-03 on app 770964251, when it compared the
    # approval program only. It later gained the clear-state program, both state schemas
    # and extra-program-pages; a local read-only run on 2026-09-17 matched all five.
    # The app's global-state contents (including the admin address), box contents and creator are not compared.
    # If it ever goes red again, that red is the finding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Compare the deployed app with the committed artifacts - both assembled programs, ARC-56 state schemas, extra-program-pages
        run: |
          set +e
          python contracts/verify_deployment.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then
            echo "::error::AWAITING TESTNET REDEPLOY of app 770964251. The live app differs from the committed artifacts in the component(s) named on its 'differing:' line. See BLOCKERS.md."
          fi
          exit "$rc"
        # Exit 1 = drift: the deployed approval or clear-state program differs from what the committed
        #          TEAL assembles to, a deployed state schema differs from the committed ARC-56 spec's,
        #          or extra-program-pages differs from the minimum the assembled programs need.
        # Exit 2 = could not check (network, missing artifact, missing field). Distinct on purpose:
        # an unreachable node must never be reported as agreement, nor as drift.
