name: trelyan-pq release (SLSA provenance + cosign keyless)

# Supply-chain provenance for tagged releases of the `trelyan-pq` SDK.
#
# On a version tag (v*) this workflow:
#   1. builds the sdist + wheel from sdk/ (hatchling),
#   2. generates SLSA v1.0 / Build-L3 provenance via the official
#      slsa-framework/slsa-github-generator generic (language-agnostic) reusable
#      workflow — which Sigstore-signs the provenance keylessly and attaches the
#      .intoto.jsonl to the GitHub Release,
#   3. signs each artifact (wheel + sdist) with cosign keyless (Sigstore OIDC, no
#      long-lived keys) and attaches the signature + certificate bundle to the Release.
#
# A verifier then proves the published artifact came from THIS repo at THIS tag —
# see RELEASES.md for the exact slsa-verifier / cosign commands.
#
# PyPI publishing is intentionally NOT part of this workflow; it is a separate,
# optional step (see the commented `pypi-publish` job at the bottom).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # manual dry-run (build only; provenance/release steps gate on a tag)

# Least-privilege at the top; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 0. The tests must pass before anything is built, signed or attested.
  #
  # This job did not exist. The graph was build -> provenance -> cosign-sign ->
  # pypi-publish, with `build`'s only substantive step being `python -m build`, and no
  # occurrence of `pytest` anywhere in this file. A tag therefore produced a signed,
  # SLSA-attested, Rekor-logged artifact without one test having run.
  #
  # The attestations were never wrong about this - SLSA provenance attests to BUILD
  # provenance and does not claim tests passed, and RELEASES.md's verify commands say
  # exactly that. The gap is that "signed and attested" reads as "vouched for" to almost
  # every downstream consumer, and here it vouched only for where the bytes came from.
  #
  # Cross-workflow `needs:` does not exist in GitHub Actions, so ci.yml cannot gate this
  # one; the check has to be duplicated here. That is why it is a small, fast job rather
  # than the full 3-OS matrix - it must be cheap enough that nobody is tempted to skip it.
  # ---------------------------------------------------------------------------
  test:
    name: Suite must pass before anything is signed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (pinned commit recorded in the run log)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"

      # The pinned Falcon source, byte-exact to the commit go-algorand vendors. Without this the
      # release gate ran `pytest` with no shared library, every lib-gated test SKIPPED, and the
      # 15-test floor was satisfied entirely by tests that touch no cryptography — after which the
      # artifact was signed and SLSA-attested. Locally that is 59 passed, 19 skipped: the gate goes
      # green while the 19 tests it exists to protect never execute.
      #
      # Mirrors ci.yml's signature-kat job deliberately. A release must not be held to a WEAKER
      # standard than a pull request.
      - name: Fetch pinned Falcon source (commit ce15e75…)
        shell: bash
        run: |
          set -o pipefail
          curl -sfL --retry 3 --retry-delay 2 --retry-all-errors             https://github.com/algorand/falcon/archive/ce15e75bceb372867daf6b8e81918ab6978686eb.tar.gz             -o falcon-src.tar.gz
          tar xzf falcon-src.tar.gz
          mv falcon-ce15e75bceb372867daf6b8e81918ab6978686eb falcon-src

      - name: Assert pinned-build digest + emulated FP backend
        run: python sdk/ci/verify_pinned_digest.py falcon-src

      - name: Build the deterministic Falcon-1024 shared library
        shell: bash
        run: |
          cd falcon-src
          EXT=so; [ "$(uname)" = "Darwin" ] && EXT=dylib
          cc -O3 -fPIC -DFALCON_UNALIGNED=0 -fno-strict-aliasing -shared -o "libfalcondet1024.$EXT"             codec.c common.c falcon.c fft.c fpr.c keygen.c rng.c shake.c sign.c vrfy.c deterministic.c
          echo "FALCON_DET1024_LIB=$PWD/libfalcondet1024.$EXT" >> "$GITHUB_ENV"

      - name: Run the SDK suite — and prove the crypto tests were not skipped
        working-directory: sdk
        shell: bash
        env:
          # Makes a still-unpopulated KAT fixture FAIL rather than skip.
          TRELYAN_REQUIRE_KAT: "1"
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests -v -rs 2>&1 | tee pytest.log

          # Assert the suite actually EXERCISED something. pytest exits 5 on "no tests collected",
          # but a suite that silently shrank still exits 0 — and a release gate that passes on a
          # shrunken suite is not a gate.
          executed=$(grep -cE "^tests/.* (PASSED|FAILED)" pytest.log || true)
          echo "tests executed: $executed"
          if [ "$executed" -lt 15 ]; then
            echo "::error::only $executed tests executed before a signed release; expected 15+"
            exit 1
          fi

          # The floor above counts tests, not COVERAGE. A run with the library missing satisfies it
          # comfortably while every Falcon test skips, which is exactly the state this job was in.
          # This grep is what makes the floor mean something.
          if grep -q "FALCON_DET1024_LIB not" pytest.log; then
            echo "::error::lib-gated crypto tests skipped in a job that builds the library — refusing to sign"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 1. Build the distribution artifacts and emit their sha256 hashes for SLSA.
  # ---------------------------------------------------------------------------
  build:
    name: Build sdist + wheel
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # base64( "sha256  <name>\n" ... ) — the subject set the SLSA generator signs.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout (pinned commit recorded in the run log)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.13"

      # The tag and the packaged version are two independent claims about which release this is,
      # and nothing bound them. Tags v0.2.0 and v0.2.1 both carry `version = "0.1.0"` in
      # sdk/pyproject.toml - so the first real run of this workflow would have built
      # trelyan_pq-0.1.0-*.whl, then SLSA-attested and Sigstore-signed those bytes under a v0.2.2
      # tag. The attestation would have been perfectly valid and described the wrong release.
      #
      # (Neither existing tag actually shipped an artifact: this workflow was first committed
      # 2026-06-18, after both, and has never run. The mislabelling was latent, not published.)
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('sdk/pyproject.toml').read_text())['project']['version'])")"
          echo "tag=${tag}  pyproject=${pkg}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match sdk/pyproject.toml version ${pkg}."
            echo "::error::Bump the version and re-tag; do not sign artifacts that name a different release."
            exit 1
          fi

      - name: Build sdist + wheel (PEP 517, hatchling) from sdk/
        working-directory: sdk
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Compute base64-encoded sha256 subjects for SLSA provenance
        id: hash
        working-directory: dist
        run: |
          # sha256sum over the exact bytes that will be released; the generator
          # binds these digests into the signed provenance statement.
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts for downstream jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. SLSA v3 (Build-L3) provenance. The reusable workflow runs on an isolated
  #    runner, Sigstore-signs the provenance keylessly, and (upload-assets:true)
  #    attaches <provenance>.intoto.jsonl to the Release for this tag.
  #    Per SLSA's design, this MUST be referenced by an immutable semver tag.
  # ---------------------------------------------------------------------------
  provenance:
    name: SLSA provenance (generic generator, keyless)
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read       # read the workflow run for the provenance materials
      id-token: write     # OIDC token for keyless Sigstore signing
      contents: write     # attach provenance to the GitHub Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      provenance-name: "trelyan-pq.intoto.jsonl"
      upload-assets: true
      upload-tag-name: "${{ github.ref_name }}"

  # ---------------------------------------------------------------------------
  # 3. cosign keyless signing (Sigstore OIDC) of each artifact, attached to the
  #    Release. This is complementary to SLSA: SLSA attests HOW/WHERE the bytes
  #    were built; the cosign blob signature lets a verifier check the bytes
  #    against this repo's OIDC identity independently of the SLSA toolchain.
  # ---------------------------------------------------------------------------
  cosign-sign:
    name: cosign keyless sign + attach to Release
    needs: [build, provenance]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC token for keyless signing (Fulcio short-lived cert)
      contents: write     # attach .sig / .pem / .bundle to the Release
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: "v2.6.0"

      - name: "Sign each artifact keylessly (Sigstore bundle: cert + sig + Rekor)"
        shell: bash
        env:
          COSIGN_YES: "true"   # non-interactive; OIDC comes from id-token, not a prompt
        run: |
          cd dist
          for f in *.whl *.tar.gz; do
            [ -e "$f" ] || continue
            echo "::group::cosign sign-blob $f"
            # --bundle is the self-contained, recommended verification artifact
            # (it embeds the signing cert and the Rekor transparency-log entry).
            cosign sign-blob "$f" \
              --bundle "$f.cosign.bundle" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
            echo "::endgroup::"
          done
          ls -l

      - name: Attach artifacts + cosign material to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cosign.bundle
            dist/*.sig
            dist/*.pem

  # ---------------------------------------------------------------------------
  # 4. OPTIONAL / SEPARATE: PyPI publish via Trusted Publishing (OIDC, no token).
  #    Left disabled by default — publishing is a deliberate, separate decision
  #    and requires a configured PyPI Trusted Publisher for this repo+workflow.
  #    To enable: set repo variable ENABLE_PYPI_PUBLISH=true and configure the Trusted Publisher.
  # ---------------------------------------------------------------------------
  pypi-publish:
    name: Publish to PyPI (optional, Trusted Publishing)
    needs: [build, provenance, cosign-sign]
    if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}   # set repo var ENABLE_PYPI_PUBLISH=true once a PyPI Trusted Publisher is configured
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trelyan-pq
    permissions:
      id-token: write     # OIDC for PyPI Trusted Publishing (no API token stored)
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish
        # Was `@release/v1` - a BRANCH ref, the weakest possible pin, on the job that publishes to
        # PyPI: it moves on every push to that branch, so the code that handles the release artifacts
        # could change without any change here. Pinned to the commit that branch pointed at.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 @ 2026-08-10
        with:
          packages-dir: dist
          attestations: true
