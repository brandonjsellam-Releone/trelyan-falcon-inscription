# gitleaks config — trelyan-falcon-inscription
#
# Path-scoped allow-list (NOT a blanket secret exemption — a real leaked secret anywhere else still
# trips the scanner):
#   1. The known-answer-test (KAT) fixture, which by design carries a committed TEST-ONLY Falcon-1024
#      private key (a NIST-style public test vector — see SECURITY.md -> "Test vectors"). Bound to no
#      Cell, never used on-chain, never produced via the sign-once-destroy path.
#   2. The generated ARC56 client + contract spec: gitleaks' generic-api-key heuristic fires on their
#      JSON "key": "<base64>" fields, but those are on-chain STATE-VARIABLE NAMES (the global/box
#      state schema), not secrets. Both are auto-generated by `algokit generate client`.
#   3. ONE file of the vendored upstream Falcon tree (third_party/falcon-det1024/src, pinned
#      algorand/falcon@ce15e75b, byte-exact — see its PROVENANCE.md): tests/test_falcon.c carries the
#      reference implementation's PUBLIC test-vector keys (`ntru_pkey_16/512/1024`, hex constants
#      beginning with the Falcon public-key header byte 0x04/0x09/0x0A) and gitleaks' generic-api-key
#      heuristic fires on them (entropy ~3.7–3.9). They are public keys published upstream, in a file
#      TRELYAN never edits. The allow-list is that ONE path, not the vendored tree: a real secret
#      anywhere else under third_party/ still trips the scanner.

title = "trelyan-falcon-inscription"

[extend]
useDefault = true

[allowlist]
description = "Path-scoped: committed KAT test vector + generated ARC56 client/spec (state-key names, not secrets) + upstream Falcon test-vector public keys in one vendored file. See SECURITY.md."
paths = [
  '''sdk/tests/vectors/det1024_kat\.json''',
  '''contracts/out/.*\.arc56\.json''',
  '''contracts/trelyan_client\.py''',
  '''third_party/falcon-det1024/src/tests/test_falcon\.c''',
]
