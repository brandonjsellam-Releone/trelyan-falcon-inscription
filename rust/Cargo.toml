[workspace]
resolver = "3"
members = [
  "crates/trelyan-pq-ffi",
  "crates/trelyan-pq-core",
  "crates/falcon-ct",
  "crates/teal-deploy-verify",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"          # MSRV, pinned per constitution §3
license = "MIT"
authors = ["Brandon Sellam"]
repository = "https://github.com/brandonjsellam-Releone/trelyan-falcon-inscription"

# ── dependency justifications (constitution §3: every new dependency needs one) ─────────────────
[workspace.dependencies]
# cc      : compiles the eleven vendored C11 sources of the pinned Falcon-1024 det1024 reference
#           (third_party/falcon-det1024/src) into a static library at build time, with exactly the
#           flags CI already proves byte-identical to the KAT goldens. The alternative — an
#           out-of-band `make` and a hand-written link line — is what the ctypes SDK does today,
#           and it is the reason `FALCON_DET1024_LIB` must be set by hand and can point anywhere.
cc      = "1"
# sha2    : RustCrypto SHA-2. Used ONLY in trelyan-pq-ffi's build script to recompute the pinned
#           tree digest (sha512/256, same construction as sdk/ci/verify_pinned_digest.py) over the
#           vendored sources BEFORE compiling them, so a drifted tree fails the build rather than
#           producing a signer that disagrees with the goldens. Not a crypto dependency of the
#           library itself; the primitive is the vendored C. RustCrypto is on the constitution's
#           allow-list (§2.1).
#           Also used by teal-deploy-verify to print the SHA-512/256 fingerprint of each program
#           (Algorand's program hash is SHA-512/256, not SHA-256). Display only: its MATCH/DRIFT
#           verdict compares the full bytecode, never the hashes. Default features only (no `asm`).
sha2    = "0.10"
# zeroize : secret-key material is wiped on drop (constitution §2.3).
zeroize = { version = "1", features = ["derive"] }
# thiserror : library error types (constitution §3 — thiserror in libraries).
thiserror = "2"
# anyhow  : binary-only error handling (constitution §3 — anyhow only in binaries). Used by the
#           falcon-ct harness binary; no library crate depends on it.
anyhow = "1"
# serde / serde_json : read sdk/tests/vectors/det1024_kat.json in the KAT tests (dev-only there).
#           Production users, both binaries/tools and neither a signer crate: falcon-ct writes its
#           JSON evidence report, and teal-deploy-verify parses algod's JSON responses. The latter is
#           UNTRUSTED network input, so it is read only through `serde_json::Value` (no derive on
#           network data) with serde_json's default recursion limit left on. (This comment used to
#           say "DEV-ONLY … no production code path parses JSON"; that stopped being true when
#           falcon-ct started writing its report.)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# base64  : teal-deploy-verify decodes the base64 program bytes algod returns
#           (`/v2/teal/compile` → `result`; `/v2/applications/{id}` → `params.approval-program` and
#           `params.clear-state-program`). Pure Rust, zero dependencies, MIT OR Apache-2.0. Its
#           STANDARD engine is strict about alphabet and padding, so a malformed field becomes
#           "could not check" instead of being silently mis-decoded into a DRIFT or a MATCH — a
#           hand-rolled decoder for untrusted input would be the riskier choice.
base64  = "0.22"

[workspace.lints.rust]
# `unsafe_code` is NOT forbidden at the workspace level on purpose: `forbid` cannot be relaxed
# per crate, and trelyan-pq-ffi must contain `unsafe` (the FFI calls). Every crate EXCEPT the
# ffi crate carries `#![forbid(unsafe_code)]` at its root — see each lib.rs. The ffi crate
# carries `#![deny(unsafe_op_in_unsafe_fn)]` and a `// SAFETY:` proof on every block.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
# Denied per constitution §3: no panicking paths in library code.
unwrap_used = "deny"
expect_used = "deny"
panic       = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
