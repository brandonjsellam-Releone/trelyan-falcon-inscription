[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trelyan-pq"
version = "0.2.2"
description = "Post-quantum (Falcon-1024) inscription tooling for Algorand: a deterministic signer in the exact encoding the native falcon_verify opcode accepts, on-chain message construction, and the pubkey-box-commit / 2048-byte arg-cap helpers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brandon J. Sellam" }]
# NOTE: "fn-dsa" and "fips-206" were removed on 2026-08-28. This package implements
# round-3 deterministic Falcon-1024 (`falcon_det1024`) — which AUDIT_READINESS.md states
# is explicitly NOT FN-DSA / draft FIPS 206 — and FIPS 206 is unpublished, so advertising
# either term on PyPI asserted conformance to a standard that does not exist and to a
# scheme this code does not implement. Falcon is NIST-SELECTED, not standardised; keep the
# keywords to what is true.
keywords = [
  "algorand", "post-quantum", "falcon", "falcon-1024", "falcon-det1024",
  "lattice", "cryptography", "pqc", "falcon_verify", "inscriptions", "avm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
]
dependencies = []  # core (falcon signer + message/box helpers) is stdlib-only

[project.optional-dependencies]
# the high-level on-chain client (trelyan_pq.inscription) needs the Algorand stack:
algorand = ["algokit-utils>=4,<5", "py-algorand-sdk>=2"]
# tomli: the `tomllib` backport. `tomllib` is stdlib only from 3.11, and requires-python
#        admits 3.10 (which the CI matrix tests), so the version test needs it there.
dev = ["pytest>=8", "tomli>=2 ; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/brandonjsellam-Releone/trelyan-falcon-inscription"
Repository = "https://github.com/brandonjsellam-Releone/trelyan-falcon-inscription"
Issues = "https://github.com/brandonjsellam-Releone/trelyan-falcon-inscription/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trelyan_pq"]
